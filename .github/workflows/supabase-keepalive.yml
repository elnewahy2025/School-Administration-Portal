name: Supabase Keepalive Ping

on:
  schedule:
    # Runs at 06:00 UTC every 3 days (e.g. 1st, 4th, 7th, 10th, 13th... of each month)
    - cron: "0 6 */3 * *"
  workflow_dispatch: # Enables manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] }}
          SUPABASE_KEY: ${{ secrets['NEXT_PUBLIC_SUPABASE_ANON_KEY'] }}
          SUPABASE_SERVICE_ROLE: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
          APP_URL: ${{ secrets['NEXT_PUBLIC_APP_URL'] }}
          CRON_SECRET: ${{ secrets['CRON_SECRET'] }}
        run: |
          echo "Starting Supabase keepalive ping (scheduled every 3 days)..."

          # 1. Direct Supabase REST API ping
          KEY="${SUPABASE_KEY:-$SUPABASE_SERVICE_ROLE}"
          if [ -n "$SUPABASE_URL" ] && [ -n "$KEY" ]; then
            echo "Attempting direct query to Supabase REST API..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/schools?select=id&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              --max-time 15)
            echo "Supabase REST API HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "SUCCESS: Supabase project successfully pinged and kept active via REST API."
              exit 0
            fi
          fi

          # 2. Deployed App Keepalive endpoint ping
          if [ -n "$APP_URL" ]; then
            echo "Attempting ping via application keepalive endpoint: ${APP_URL}/api/keepalive"
            if [ -n "$CRON_SECRET" ]; then
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${APP_URL}/api/keepalive" \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                --max-time 15)
            else
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${APP_URL}/api/keepalive" \
                --max-time 15)
            fi

            echo "App Keepalive HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "SUCCESS: Supabase project successfully pinged and kept active via app route."
              exit 0
            fi
          fi

          echo "WARNING: Neither (NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY) nor NEXT_PUBLIC_APP_URL are configured in GitHub Actions Secrets."
          echo "To enable automated pings:"
          echo "1. Go to repository Settings -> Secrets and variables -> Actions"
          echo "2. Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY (or NEXT_PUBLIC_APP_URL)"
          exit 0
